[package]
name = "aestheris"
version = "0.13.1"
edition = "2024"
description = "Aestheris Gateway : la passerelle de confiance entre les agents IA et vos API"
license = "Apache-2.0"
repository = "https://github.com/hamdok/aestheris"
publish = false

[lib]
name = "aestheris"
path = "src/lib.rs"

[[bin]]
name = "aestheris"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["zeroize"] }
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
globset = "0.4.20"
hex = "0.4.3"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.189"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5.0"
