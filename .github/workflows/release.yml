name: release

# Une étiquette vX.Y.Z publie les binaires, leurs empreintes et une attestation de provenance
# (Sigstore) : `gh attestation verify <archive> --repo hamdok/aestheris` prouve qu'ils ont été
# construits ici, à partir de ce code.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust stable
        env:
          TARGET: ${{ matrix.target }}
        run: rustup update stable && rustup default stable && rustup target add "$TARGET"
      - name: Compilation
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Archive
        id: pkg
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          name="aestheris-$TAG-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/aestheris" LICENSE NOTICE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pkg.outputs.archive }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.pkg.outputs.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Empreintes et publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum aestheris-*.tar.gz > SHA256SUMS
          gh release create "$TAG" --repo "$REPO" --title "Aestheris $TAG" --generate-notes \
            --prerelease aestheris-*.tar.gz SHA256SUMS
