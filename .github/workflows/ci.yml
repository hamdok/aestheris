name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bac à sable Linux (bubblewrap et profil AppArmor d'Ubuntu 24.04)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap
          sudo install -m 0644 packaging/apparmor/bwrap /etc/apparmor.d/bwrap
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
      - name: Rust stable
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
